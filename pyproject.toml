[project]
name = "customer-service-rag"
version = "0.1.0"
description = "Production-grade customer service RAG demo: document upload + grounded chat API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "httpx2>=2.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "uvicorn[standard]>=0.50.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["error"]
markers = [
    "integration: hits a live backing service (Ollama at OLLAMA_BASE_URL, or Qdrant at QDRANT_URL); auto-skipped when unreachable, unless QDRANT_REQUIRED=1 makes an unreachable Qdrant a failure",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# "app" is this project's package; pin it as first-party so submodules
# whose names shadow builtins (e.g. app.eval) group with the rest of the
# first-party imports instead of drifting into the third-party block.
known-first-party = ["app"]
