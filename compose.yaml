name: customer-service-rag

services:
  app:
    build: .
    # All published ports bind to loopback by design: qdrant/redis run with no
    # auth, so nothing here may listen on the LAN. To expose a port deliberately,
    # change its bind address (e.g. "0.0.0.0:8000:8000").
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # Optional: supplies ANTHROPIC_API_KEY and friends once a .env exists.
      - path: .env
        required: false
    environment:
      # In-network endpoints and container paths; these override any .env values.
      DB_PATH: /data/rag.sqlite3
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Ollama runs on the host (Apple-Silicon GPU in dev), not as a compose service.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    volumes:
      - rag-data:/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only (readiness probe with dependency checks is #21).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget; probe the HTTP port via bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  rag-data:
  qdrant-storage:
